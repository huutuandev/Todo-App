server:
  port: 8080

spring:
  application:
    name: todo-app

  datasource:
    url: jdbc:h2:file:./data/tododb;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 180505

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

logging:
  level:
    com.todoapp: INFO
